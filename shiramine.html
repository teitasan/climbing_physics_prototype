<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白峰 — 登山マップ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#172027;color:#f5f6ef;overflow:hidden}canvas{display:block;touch-action:none}button,a{font:inherit}button{color:inherit;background:#18232be8;border:1px solid #ffffff32;border-radius:6px;padding:9px 13px;cursor:pointer}button:hover{background:#33454f}button:focus-visible,a:focus-visible{outline:2px solid #ffd36e}a{color:#efcb80}#journey{position:fixed;top:22px;left:22px;width:min(355px,calc(100vw - 44px));padding:20px;background:#111c25db;border:1px solid #ffffff26;border-radius:10px;pointer-events:none}small{color:#bdcbd1;font-size:12px;letter-spacing:.12em}h1{font-size:27px;font-weight:500;margin:7px 0 10px}#hint{font-size:14px;line-height:1.7;color:#c5d0d6;margin:10px 0 0}.metrics{display:flex;gap:24px;font-size:15px;margin:12px 0}.track{height:3px;background:#ffffff25}#progress{height:100%;background:#edbf62;width:0}#controls{position:fixed;right:22px;top:22px;display:flex;gap:7px;flex-wrap:wrap;max-width:360px;justify-content:flex-end}#help{position:fixed;left:22px;bottom:22px;background:#111c25cf;padding:13px 17px;border-radius:8px;font-size:14px;line-height:1.8}#help p{margin:0}kbd{color:#efcb80;font:inherit}#stats{color:#c7d1d6;font-size:12px}#map{position:fixed;right:22px;bottom:22px;width:210px;height:210px;border:1px solid #ffffff35;border-radius:8px;background:#111c25cf}#overlay{position:fixed;inset:0;z-index:20;background:#172027;display:grid;place-content:center;text-align:center;padding:30px}#overlay p{max-width:560px;color:#bac9d1;line-height:1.8}#overlay[hidden]{display:none}#notice{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);padding:18px 26px;background:#15232be6;border:1px solid #e5be65;border-radius:8px;font-size:20px;pointer-events:none;opacity:0;transition:opacity .4s}#audit{position:fixed;bottom:250px;right:22px;max-width:450px;background:#101820ed;white-space:pre-wrap;font:12px/1.6 monospace;padding:10px;display:none} @media(max-width:760px){#controls{top:auto;bottom:160px;right:12px;max-width:200px}#map{width:130px;height:130px;right:12px;bottom:12px}#journey{top:12px;left:12px;width:290px;padding:14px}#help{left:12px;bottom:12px;max-width:calc(100vw - 160px);font-size:12px;padding:8px}h1{font-size:22px}}
</style></head><body>
<section id="journey"><small>MESH TERRAIN LAB / 登山マップ 01</small><h1 id="stage">白峰・東峰</h1><div class="metrics"><span id="altitude">— m</span><span id="distance">—</span></div><div class="track"><div id="progress"></div></div><p id="hint">地形を読み込んでいます。</p></section>
<nav id="controls" aria-label="表示と再開"><button id="map-toggle">全体を見る [M]</button><button id="respawn">チェックポイント [R]</button><button id="quality">画質：標準</button></nav>
<div id="help"><p><kbd>WASD</kbd> 移動　<kbd>Shift</kbd> 走る　<kbd>Space</kbd> ジャンプ</p><p><kbd>C</kbd> 慎重に歩く　<kbd>F</kbd> 壁から離す</p><p id="mouse-help">マウスで視点操作（クリックで自由移動）</p><p><kbd>Q / E</kbd> 旋回　ホイールで距離　<kbd>Esc</kbd> マウス解放</p><p id="stats">読み込み中…</p></div>
<canvas id="map" width="420" height="420" aria-label="登山ルートと現在地"></canvas><div id="notice" role="status"></div><pre id="audit"></pre>
<div id="overlay"><small>SHIRAMINE / 白峰</small><h1>山への道を準備しています</h1><p id="status">地形・登山者・当たり判定を読み込み中…</p></div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/jsm/":"./vendor/three/jsm/","three-mesh-bvh":"./vendor/three-mesh-bvh/index.module.js"}}</script>
<script type="module" src="./src/shiramine-main.js"></script>
</body></html>
